openapi: 3.0.3
info:
  title: Hotel Room Booking System API
  description: >
    REST API for managing hotel room bookings. Supports creating bookings
    (with automatic customer registration or reuse), retrieving booking details,
    and cancelling bookings via soft delete.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Bookings
    description: Operations related to hotel room bookings

paths:

  /bookings:
    post:
      tags:
        - Bookings
      summary: Create a new booking
      description: >
        Creates a new room booking. If the customer email already exists in the
        system, the existing customer record is reused. Otherwise, a new customer
        is registered automatically. Validates room availability for the requested
        dates and calculates the total price based on the room's price per night
        and the duration of stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              customer_name: "John"
              customer_email: "john@example.com"
              customer_phone: "9876543210"
              room_id: 1
              check_in: "2026-11-10"
              check_out: "2026-11-13"
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreateResponse'
              example:
                message: "Booking created successfully"
                booking_id: 1
                customer_id: 1
                customer_name: "John"
                room_id: 1
                room_number: "101"
                room_type: "Standard"
                check_in: "2026-11-10"
                check_out: "2026-11-13"
                total_nights: 3
                price_per_night: 2000.00
                total_price: 6000.00
        '409':
          description: Conflict — room already booked for the selected dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                room_unavailable:
                  summary: Room already booked for selected dates
                  value:
                    detail:
                      error_code: "ROOM_NOT_AVAILABLE"
                      message: "Room is not available for the selected dates."
        '404':
          description: Room not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Room with id 1 not found."
        '422':
          description: Unprocessable entity — invalid request body format or check_out is not after check_in
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type: string
                          description: Location of the error (field path)
                        msg:
                          type: string
                          description: Human-readable error message
                        type:
                          type: string
                          description: Pydantic error type code
              examples:
                missing_field:
                  summary: Required field missing
                  value:
                    detail:
                      - loc: ["body", "customer_email"]
                        msg: "Field required"
                        type: "missing"
                invalid_dates:
                  summary: check_out is not after check_in
                  value:
                    detail:
                      - loc: ["body", "check_out"]
                        msg: "Value error, check_out must be after check_in."
                        type: "value_error"
                past_checkin:
                  summary: check_in is in the past
                  value:
                    detail:
                      - loc: ["body", "check_in"]
                        msg: "Value error, check_in must not be in the past."
                        type: "value_error"

  /bookings/{booking_id}:
    get:
      tags:
        - Bookings
      summary: Retrieve booking details
      description: >
        Fetches full details of a specific booking by its ID, including
        associated customer information and room details.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailResponse'
              example:
                booking_id: 1
                customer_id: 1
                customer_name: "John"
                customer_email: "john@example.com"
                customer_phone: "9876543210"
                room_id: 1
                room_number: "101"
                room_type: "Standard"
                price_per_night: 2000.00
                check_in: "2026-11-10"
                check_out: "2026-11-13"
                total_price: 6000.00
        '404':
          description: Booking not found or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Booking with id 1 not found."

    delete:
      tags:
        - Bookings
      summary: Cancel a booking
      description: >
        Cancels an existing booking by performing a soft delete — sets
        is_active to FALSE on the booking record. The booking data is
        retained in the database for audit purposes.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCancelResponse'
              example:
                message: "Booking cancelled successfully"
                booking_id: 1
        '404':
          description: Booking not found or already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Booking with id 1 not found."

components:

  parameters:
    BookingId:
      name: booking_id
      in: path
      required: true
      description: Unique identifier of the booking
      schema:
        type: integer
        example: 1

  schemas:

    BookingRequest:
      type: object
      required:
        - customer_name
        - customer_email
        - room_id
        - check_in
        - check_out
      properties:
        customer_name:
          type: string
          maxLength: 100
          description: Full name of the customer
          example: "John"
        customer_email:
          type: string
          format: email
          maxLength: 100
          description: >
            Email address of the customer. If this email already exists,
            the existing customer record is reused.
          example: "john@example.com"
        customer_phone:
          type: string
          maxLength: 15
          description: Contact phone number of the customer (optional)
          example: "9876543210"
        room_id:
          type: integer
          description: ID of the room to be booked
          example: 1
        check_in:
          type: string
          format: date
          description: Check-in date (YYYY-MM-DD)
          example: "2026-11-10"
        check_out:
          type: string
          format: date
          description: Check-out date (YYYY-MM-DD). Must be after check_in.
          example: "2026-11-13"

    BookingCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: "Booking created successfully"
        booking_id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        customer_name:
          type: string
          example: "John"
        room_id:
          type: integer
          example: 1
        room_number:
          type: string
          example: "101"
        room_type:
          type: string
          enum:
            - Standard
            - Deluxe
            - Executive
            - Suite
            - Presidential Suite
          example: "Standard"
        check_in:
          type: string
          format: date
          example: "2026-11-10"
        check_out:
          type: string
          format: date
          example: "2026-11-13"
        total_nights:
          type: integer
          description: Number of nights calculated from check_in to check_out
          example: 3
        price_per_night:
          type: number
          format: float
          example: 2000.00
        total_price:
          type: number
          format: float
          description: total_nights × price_per_night
          example: 6000.00

    BookingDetailResponse:
      type: object
      properties:
        booking_id:
          type: integer
          example: 1
        customer_id:
          type: integer
          example: 1
        customer_name:
          type: string
          example: "John"
        customer_email:
          type: string
          format: email
          example: "john@example.com"
        customer_phone:
          type: string
          example: "9876543210"
        room_id:
          type: integer
          example: 1
        room_number:
          type: string
          example: "101"
        room_type:
          type: string
          enum:
            - Standard
            - Deluxe
            - Executive
            - Suite
            - Presidential Suite
          example: "Standard"
        price_per_night:
          type: number
          format: float
          example: 2000.00
        check_in:
          type: string
          format: date
          example: "2026-11-10"
        check_out:
          type: string
          format: date
          example: "2026-11-13"
        total_price:
          type: number
          format: float
          example: 6000.00

    BookingCancelResponse:
      type: object
      properties:
        message:
          type: string
          example: "Booking cancelled successfully"
        booking_id:
          type: integer
          example: 1

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message
          example: "Booking with id 1 not found."
